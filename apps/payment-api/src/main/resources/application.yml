server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 잔고 조회 전용 read-only 계정 (쓰기는 오직 balance-worker가 담당)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payments}
    username: ${DB_USER:api_ro}
    password: ${DB_PASSWORD:api-ro-pass}
    hikari:
      maximum-pool-size: 5
      # DB가 아직 안 떠 있어도 애플리케이션은 기동되도록 한다
      initialization-fail-timeout: -1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  topics:
    requested: payment.requested
    result: payment.result
  # Pod마다 고유한 consumer group → 모든 Pod가 모든 결과 이벤트를 받아 인메모리 상태를 맞춘다
  # POD_NAME은 K8s Downward API로 주입된다
  result-group-id: payment-api-${POD_NAME:local}
  pod-name: ${POD_NAME:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
