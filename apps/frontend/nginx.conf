# 이미지 기본 설정 (docker compose용): 정적 파일 + /api 리버스 프록시
# K8s에서는 Ingress가 /api를 payment-api Service로 직접 보내므로,
# Helm 차트의 ConfigMap이 프록시 없는 설정으로 이 파일을 덮어쓴다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://payment-api:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
