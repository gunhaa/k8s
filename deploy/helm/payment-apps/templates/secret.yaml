apiVersion: v1
kind: Secret
metadata:
  name: payment-db-credentials
  labels:
    {{- include "payment-apps.labels" (dict "root" . "name" "payment-db-credentials") | nindent 4 }}
type: Opaque
stringData:
  api-ro-password: {{ required "secrets.apiReadonlyPassword is required" .Values.secrets.apiReadonlyPassword | quote }}
  worker-password: {{ required "secrets.workerPassword is required" .Values.secrets.workerPassword | quote }}
