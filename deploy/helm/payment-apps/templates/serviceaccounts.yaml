{{- /* 앱마다 별도 ServiceAccount: 권한을 분리할 수 있고, API 토큰은 쓰지 않으므로 마운트하지 않는다 */ -}}
{{- range $name := list "frontend" "payment-api" "balance-worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "payment-apps.labels" (dict "root" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
