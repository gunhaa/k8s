# 기본값. 환경별 차이는 values-dev.yaml / values-prod.yaml 에서 덮어쓴다.
#   helm template payment-apps deploy/helm/payment-apps -f deploy/helm/payment-apps/values-dev.yaml

global:
  env: dev
  # 모든 앱 이미지의 기본 태그 (scripts/30-build-load.sh 가 git short sha로 빌드한다)
  imageTag: dev
  imagePullPolicy: IfNotPresent   # kind load로 노드에 넣은 이미지를 쓰므로 Always 금지
  imageRegistry: ""                # 예: ghcr.io/<user>/ (끝에 / 포함)

ingress:
  enabled: true
  className: traefik
  host: payment.localtest.me       # *.localtest.me 는 127.0.0.1로 resolve 되는 공용 도메인

kafka:
  bootstrapServers: kafka.data-dev.svc.cluster.local:9092

mysql:
  host: mysql.data-dev.svc.cluster.local
  port: 3306
  database: payments

# 학습용 평문 값. 실무에서는 External Secrets / Sealed Secrets 사용
secrets:
  apiReadonlyPassword: api-ro-pass
  workerPassword: worker-pass

serviceMonitor:
  enabled: false                   # kube-prometheus-stack(CRD)이 설치된 경우에만 true
  interval: 15s

frontend:
  enabled: true
  image: k8s-lab/frontend
  replicas: 1
  pollIntervalMs: 1000
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

paymentApi:
  enabled: true
  image: k8s-lab/payment-api
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    minAvailable: 1

balanceWorker:
  enabled: true
  image: k8s-lab/balance-worker
  # 파티션이 3개라 4개 이상은 놀게 된다 (consumer group 내 파티션당 1 consumer)
  replicas: 1
  # Hibernate 스키마 관리 (spring.jpa.hibernate.ddl-auto)
  #   create: Pod가 뜰 때마다 테이블 DROP → 재생성 (데이터 초기화). replica 1개일 때만 안전
  #   update: 없으면 만들고 기존 데이터는 유지
  ddlAuto: create
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }
  pdb:
    enabled: true
    maxUnavailable: 1

# initContainer가 의존 서비스(Kafka/MySQL) 포트가 열릴 때까지 기다릴 때 쓰는 이미지
waitImage: busybox:1.37
