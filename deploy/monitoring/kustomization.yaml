# Grafana 대시보드를 ConfigMap으로 만든다. Grafana sidecar가 라벨을 보고 자동으로 가져간다.
#   kubectl apply -k deploy/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: payment-platform-dashboard
    files:
      - dashboards/payment-platform.json
