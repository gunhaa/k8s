# 네임스페이스 전체가 쓸 수 있는 리소스 총량 상한.
# requests/limits 쿼터가 있으면 모든 컨테이너가 값을 가져야 하므로 LimitRange 기본값과 같이 쓴다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
    pods: "20"
