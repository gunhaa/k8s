# 데이터 워크로드 전용 ServiceAccount. K8s API를 호출할 일이 없으므로 토큰 마운트를 끈다(Pod spec에서).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-workload
automountServiceAccountToken: false
---
# RBAC 실습용: 이 네임스페이스를 '읽기만' 할 수 있는 Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # secrets는 일부러 제외 → `kubectl auth can-i get secrets --as dev-user` 로 거부되는지 확인
---
# 가상의 사용자 dev-user에게 viewer Role을 부여
# 확인: kubectl auth can-i list pods -n data-dev --as dev-user   → yes
#       kubectl auth can-i delete pods -n data-dev --as dev-user → no
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-viewer
subjects:
  - kind: User
    name: dev-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: viewer
  apiGroup: rbac.authorization.k8s.io
