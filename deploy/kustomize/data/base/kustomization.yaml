# 데이터 계층 base. 네임스페이스와 Secret은 overlay(dev/prod)가 정한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: payment-platform
    includeSelectors: false

resources:
  - policies/resource-quota.yaml
  - policies/limit-range.yaml
  - policies/network-policy.yaml
  - policies/rbac.yaml
  - mysql/statefulset.yaml
  - mysql/service.yaml
  - kafka/statefulset.yaml
  - kafka/service.yaml
  - jobs/kafka-topic-init.yaml
  - jobs/balance-reconcile.yaml

# 파일 내용이 바뀌면 이름 뒤 해시가 바뀌고 → 참조하는 Pod가 자동으로 롤링 재시작된다
configMapGenerator:
  - name: mysql-initdb
    files:
      - mysql/initdb/02-readonly-user.sh
  - name: kafka-scripts
    files:
      - kafka/create-topics.sh
  - name: reconcile-sql
    files:
      - jobs/reconcile.sql
