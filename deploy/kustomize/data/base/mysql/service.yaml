# Headless Service (clusterIP: None)
# - 가상 IP 없이 DNS가 Pod IP를 직접 반환한다
# - StatefulSet Pod에 고정 DNS(mysql-0.mysql)를 부여한다
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
